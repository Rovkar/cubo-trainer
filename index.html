<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubo Trainer</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/notation.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand">Cubo Trainer</h1>
    <span id="sync-status" class="sync-status s-local" role="status"><span class="dot"></span><span class="txt">Saved in this browser</span></span>
    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language" data-i18n-aria="lang.label">
      <button type="button" class="lang-btn" data-lang="en" title="English" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" data-lang="es" title="Español" aria-pressed="false">ES</button>
    </div>
    <div class="session-box">
      <label for="session-select" class="muted small" data-i18n="profile.label">Profile</label>
      <select id="session-select" aria-label="Profile" data-i18n-aria="profile.label"></select>
      <button class="btn small-btn" id="new-session" title="New profile" data-i18n-title="profile.new.title" data-i18n="profile.new.btn">+ New profile</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab on" data-tab="timer" data-i18n="tab.timer">Timer</button>
    <button class="tab" data-tab="trainer" data-i18n="tab.trainer">Trainer</button>
    <button class="tab" data-tab="stats" data-i18n="tab.stats">Stats</button>
    <button class="tab" data-tab="plan" data-i18n="tab.plan">Plan</button>
    <button class="tab" data-tab="notation" data-i18n="tab.notation">Notation</button>
  </nav>
</header>
<div id="warn" class="warn" data-i18n="warn.noSave" hidden>Your progress will not be saved in this browser</div>
<main>
  <section id="view-timer" class="view"></section>
  <section id="view-trainer" class="view" hidden></section>
  <section id="view-stats" class="view" hidden></section>
  <section id="view-plan" class="view" hidden></section>
  <section id="view-notation" class="view" hidden></section>
</main>
<script src="js/i18n.js"></script>
<script src="js/cube.js"></script>
<script src="js/cube3d.js"></script>
<script src="js/algs.js"></script>
<script src="js/plan.js"></script>
<script src="js/storage.js"></script>
<script src="js/sync.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/stats.js"></script>
<script src="js/timer.js"></script>
<script src="js/trainer.js"></script>
<script src="js/planview.js"></script>
<script src="js/notation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
